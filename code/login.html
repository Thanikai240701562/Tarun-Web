<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — TeamForge</title>
    <meta name="description" content="Sign in to TeamForge Intelligent Student Team Formation Platform">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom Design System -->
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="text-center mb-4">
                    <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none text-dark fs-3 fw-bold mb-2">
                        <div class="brand-icon">
                            <i class="bi bi-diagram-3-fill"></i>
                        </div>
                        <span>Team<span style="color:#4f46e5;">Forge</span></span>
                    </a>
                    <p class="text-muted small">Sign in to access your student dashboard & teams</p>
                </div>

                <!-- Demo Quick Login Helper -->
                <div class="card-tf p-3 mb-4 bg-white border shadow-sm">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="small fw-bold text-muted text-uppercase" style="font-size:0.7rem;">
                            <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Logins
                        </span>
                        <span class="badge bg-secondary-subtle text-secondary" style="font-size:0.7rem;">Pre-Seeded Accounts</span>
                    </div>
                    <div class="d-flex flex-column gap-2">
                        <button type="button" class="btn btn-sm btn-light border text-start d-flex justify-content-between align-items-center py-2" onclick="fillCreds('faculty@university.edu', 'Password123!')">
                            <span class="small fw-semibold"><i class="bi bi-shield-check text-purple me-2"></i> Dr. Sarah (Faculty/Admin)</span>
                            <span class="text-muted small" style="font-size:0.75rem;">Auto-fill &rarr;</span>
                        </button>
                        <button type="button" class="btn btn-sm btn-light border text-start d-flex justify-content-between align-items-center py-2" onclick="fillCreds('aarav.sharma@student.edu', 'Password123!')">
                            <span class="small fw-semibold"><i class="bi bi-award-fill text-primary me-2"></i> Aarav Sharma (Team Leader)</span>
                            <span class="text-muted small" style="font-size:0.75rem;">Auto-fill &rarr;</span>
                        </button>
                        <button type="button" class="btn btn-sm btn-light border text-start d-flex justify-content-between align-items-center py-2" onclick="fillCreds('ananya.iyer@student.edu', 'Password123!')">
                            <span class="small fw-semibold"><i class="bi bi-person-fill text-info me-2"></i> anaya (Student/AI)</span>
                            <span class="text-muted small" style="font-size:0.75rem;">Auto-fill &rarr;</span>
                        </button>
                    </div>
                </div>

                <!-- Login Card -->
                <div class="card-tf shadow-lg border p-4 p-md-5 bg-white">
                    <h4 class="fw-bold text-dark mb-4">Welcome Back</h4>

                    <div id="loginAlert" class="alert alert-danger d-none align-items-center p-3 mb-4 rounded-3" role="alert">
                        <i class="bi bi-exclamation-triangle-fill fs-5 me-2 flex-shrink-0"></i>
                        <div class="small fw-medium" id="loginAlertMessage"></div>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold text-secondary">College Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control border-start-0" id="email" name="email" value="aarav.sharma@student.edu" placeholder="student@university.edu" required autocomplete="email">
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="password" class="form-label small fw-semibold text-secondary mb-0">Password</label>
                                <a href="#" class="small text-decoration-none text-muted" onclick="alert('For demo evaluation accounts, the password is Password123!')">Forgot password?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control border-start-0" id="password" name="password" value="Password123!" placeholder="Enter password" required autocomplete="current-password">
                            </div>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-tf-primary w-100 py-2 fs-6 mb-3">
                            <span>Sign In to TeamForge</span> <i class="bi bi-arrow-right ms-1"></i>
                        </button>

                        <div class="text-center text-muted small">
                            Don't have an account yet? <a href="register.html" class="text-primary fw-semibold text-decoration-none">Register here</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & JS Framework -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
    function fillCreds(email, pwd) {
        document.getElementById('email').value = email;
        document.getElementById('password').value = pwd;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('loginAlert');
        const alertMsg = document.getElementById('loginAlertMessage');
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        alertBox.classList.add('d-none');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';

        try {
            const res = await window.api.login(email, password);
            if (res.success) {
                window.tfToast('Signed in successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 500);
            } else {
                alertMsg.textContent = res.error || 'Invalid college email or password.';
                alertBox.classList.remove('d-none');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Sign In to TeamForge</span> <i class="bi bi-arrow-right ms-1"></i>';
            }
        } catch (err) {
            alertMsg.textContent = 'Connection error. Please try again.';
            alertBox.classList.remove('d-none');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Sign In to TeamForge</span> <i class="bi bi-arrow-right ms-1"></i>';
        }
    });
    </script>
</body>
</html>
